version: "2.0"
registry_name: "KumbhRakshak Model Registry"
environment: "DEMO_MODE"

models:
  - name: "yolov8_detection"
    display_name: "Object Detection (YOLOv8)"
    provider: "Ultralytics YOLO"
    version: "8.3.49"
    weights: "yolov8n.pt"
    threshold: 0.50
    input_type: "Video Frame (RGB)"
    enabled: true
    performance:
      fps_target: 30
      avg_latency_ms: 18.5
      mAP50_95: 0.528

  - name: "bytetrack_tracking"
    display_name: "Object Tracking (ByteTrack)"
    provider: "ByteTrack"
    version: "1.2.0"
    threshold: 0.60
    input_type: "Bounding Boxes"
    enabled: true
    performance:
      avg_latency_ms: 4.2
      mota: 0.76

  - name: "crowd_analytics"
    display_name: "Crowd Analytics & Optical Flow"
    provider: "Farnebäck Optical Flow"
    version: "2.1.0"
    threshold: 0.75
    input_type: "Video Stream"
    enabled: true
    performance:
      avg_latency_ms: 22.0
      accuracy: 0.89

  - name: "fire_smoke_temporal"
    display_name: "Temporal Fire & Smoke Detector"
    provider: "HSV Temporal Mask"
    version: "2.0.4"
    threshold: 0.70
    input_type: "Video Frame"
    enabled: true
    performance:
      avg_latency_ms: 6.8
      persistence_frames: 5

  - name: "pose_fall_detector"
    display_name: "Pose & Fall Detector"
    provider: "YOLOv8-Pose"
    version: "1.1.0"
    threshold: 0.65
    input_type: "Keypoints"
    enabled: true
    performance:
      avg_latency_ms: 16.4

  - name: "ocr_signage"
    display_name: "Signage OCR"
    provider: "PaddleOCR / EasyOCR"
    version: "2.7.0"
    threshold: 0.55
    input_type: "Image Crop"
    enabled: true
    languages: ["en", "hi", "mr"]
    performance:
      avg_latency_ms: 45.0

  - name: "speech_whisper"
    display_name: "Speech-to-Text (Whisper)"
    provider: "Faster-Whisper"
    version: "1.1.0"
    threshold: 0.60
    input_type: "Audio 16kHz"
    enabled: true
    languages: ["hi", "mr", "en"]
    performance:
      avg_latency_ms: 120.0

  - name: "vlm_verifier"
    display_name: "Vision-Language Model"
    provider: "OpenAI GPT-4o / Claude Vision"
    version: "1.0.0"
    threshold: 0.75
    input_type: "Image + Prompt"
    enabled: true
    selective_only: true
    performance:
      avg_latency_ms: 850.0

  - name: "nlp_claim_extractor"
    display_name: "NLP Claim Extractor"
    provider: "Structured LLM"
    version: "2.3.0"
    threshold: 0.70
    input_type: "Text"
    enabled: true
    performance:
      avg_latency_ms: 35.0

  - name: "sentence_embeddings"
    display_name: "Semantic Embeddings"
    provider: "sentence-transformers/all-MiniLM-L6-v2"
    version: "3.3.1"
    threshold: 0.82
    input_type: "Text"
    enabled: true
    dimension: 384
    performance:
      avg_latency_ms: 8.5

  - name: "xgboost_forecast"
    display_name: "Crowd Inflow Forecaster"
    provider: "XGBoost"
    version: "2.1.3"
    threshold: 0.70
    input_type: "Time-Series Tabular"
    enabled: true
    horizons: [15, 30, 60]
    performance:
      avg_latency_ms: 3.2
      r2_score: 0.91

  - name: "deterministic_risk"
    display_name: "Explainable Risk Engine"
    provider: "Deterministic 10-Factor Matrix"
    version: "3.0.0"
    threshold: 0.50
    input_type: "Evidence Dict"
    enabled: true
    performance:
      avg_latency_ms: 0.8
