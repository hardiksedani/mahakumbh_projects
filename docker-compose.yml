version: "3.9"



services:

  redis:

    image: redis:7-alpine

    ports:

      - "6379:6379"

    healthcheck:

      test: ["CMD", "redis-cli", "ping"]

      interval: 5s

      timeout: 3s

      retries: 5



  backend:

    build:

      context: ./backend

      dockerfile: Dockerfile

    env_file:

      - .env

    environment:

      REDIS_URL: redis://redis:6379/0

      FIREBASE_USE_MEMORY: "true"

    ports:

      - "8000:8000"

    depends_on:

      redis:

        condition: service_healthy

    volumes:

      - ./backend:/app

      - model_cache:/root/.cache



  worker:

    build:

      context: ./backend

      dockerfile: Dockerfile

    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

    env_file:

      - .env

    environment:

      REDIS_URL: redis://redis:6379/0

      FIREBASE_USE_MEMORY: "true"

    depends_on:

      redis:

        condition: service_healthy

    volumes:

      - ./backend:/app

      - model_cache:/root/.cache



  frontend:

    build:

      context: ./frontend

      dockerfile: Dockerfile

    env_file:

      - .env

    environment:

      NEXT_PUBLIC_API_URL: http://localhost:8000

      NEXT_PUBLIC_WS_URL: ws://localhost:8000

    ports:

      - "3000:3000"

    depends_on:

      - backend

    volumes:

      - ./frontend:/app

      - /app/node_modules

      - /app/.next



volumes:

  model_cache:

